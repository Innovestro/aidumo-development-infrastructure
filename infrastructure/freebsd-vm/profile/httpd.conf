# Dedicated #6 local approximation; no provider topology claim.
ServerRoot "/usr/local"
PidFile /var/run/httpd.pid
Listen 127.0.0.1:18080
Listen 127.0.0.1:18443
ServerName localhost
AcceptFilter http none
AcceptFilter https none
SSLSessionCache "shmcb:/var/run/b6-ssl-scache(512000)"
LoadModule mpm_event_module libexec/apache24/mod_mpm_event.so
LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule authz_host_module libexec/apache24/mod_authz_host.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule rewrite_module libexec/apache24/mod_rewrite.so
LoadModule headers_module libexec/apache24/mod_headers.so
LoadModule proxy_module libexec/apache24/mod_proxy.so
LoadModule proxy_fcgi_module libexec/apache24/mod_proxy_fcgi.so
LoadModule ssl_module libexec/apache24/mod_ssl.so
LoadModule socache_shmcb_module libexec/apache24/mod_socache_shmcb.so
LoadModule reqtimeout_module libexec/apache24/mod_reqtimeout.so
User www
Group www
ServerTokens Prod
ServerSignature Off
Timeout 30
ProxyTimeout 15
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
StartServers 1
ServerLimit 2
ThreadsPerChild 16
MinSpareThreads 16
MaxSpareThreads 32
MaxRequestWorkers 32
MaxConnectionsPerChild 1000
LimitRequestBody 10485760
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestLine 8190
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
TypesConfig etc/apache24/mime.types
ErrorLog /var/log/b6-httpd-error.log
LogFormat "%h %t \"%r\" %>s %b" b6
CustomLog /var/log/b6-httpd-access.log b6
DocumentRoot /usr/local/www/aidumo-b6/public
DirectoryIndex index.php
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory /usr/local/www/aidumo-b6/public>
    Options -Indexes +FollowSymLinks
    AllowOverride FileInfo
    Require local
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/var/run/b6-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
RequestHeader unset Proxy early
Header always set X-Content-Type-Options nosniff
<VirtualHost 127.0.0.1:18443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /usr/local/etc/aidumo-b6/tls/cert.pem
    SSLCertificateKeyFile /usr/local/etc/aidumo-b6/tls/key.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
</VirtualHost>
