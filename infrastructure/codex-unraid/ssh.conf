Host github.com
    IdentityFile /run/secrets/git_key

Host github-suite
    IdentityFile /run/secrets/git_key_suite

Host github.com github-suite
    HostName github.com
    HostKeyAlias github.com
    User git
    IdentityAgent none
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    UserKnownHostsFile /etc/codex-known-hosts
    HostKeyAlgorithms ssh-ed25519
    LogLevel ERROR

# Explicit -F selects this file instead of user/system SSH configuration.
Host aidumo-linux-runner-01 192.168.40.130
    HostName 192.168.40.130
    User aidumo
    IdentityFile /run/secrets/linux_vm_key
    IdentityAgent none
    IdentitiesOnly yes
    BatchMode yes
    PreferredAuthentications publickey
    StrictHostKeyChecking yes
    UserKnownHostsFile /run/secrets/linux_vm_known_hosts
    GlobalKnownHostsFile /dev/null
    HostKeyAlgorithms ssh-ed25519
    UpdateHostKeys no
    ForwardAgent no
    ForwardX11 no
    ClearAllForwardings yes
    RequestTTY no
    ConnectTimeout 10
    ConnectionAttempts 1
